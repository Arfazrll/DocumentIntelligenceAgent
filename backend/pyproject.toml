[project]
name = "docintel-ai"
version = "1.0.0"
description = "DocIntel AI — Multi-Agent Document Intelligence Platform"
requires-python = ">=3.11"
authors = [
    { name = "Syahril Arfian Almazril" }
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # Database (SQLite)
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Task Queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Validation & Structured Output
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "instructor>=1.3.0",

    # AI/ML - Agent Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # AI/ML - Document Parsing
    "docling>=2.0.0",

    # AI/ML - OCR
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.8.0",

    # AI/ML - Embedding & Reranking
    "FlagEmbedding>=1.2.0",

    # AI/ML - LLM Clients
    "groq>=0.9.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",

    # Vector Database
    "qdrant-client>=1.10.0",

    # Observability
    "langfuse>=2.40.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ragas>=0.1.10",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as evaluation tests (deselect with '-m \"not eval\"')",
]
